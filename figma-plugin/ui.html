<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #f4f5f7;
        color: #1a1d21;
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        color: #8b929c;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        width: 100%;
        padding: 10px 16px;
        border: 1px solid #ffffff1f;
        border-radius: 8px;
        background: #4f46e5;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #4338ca;
      }
      #status {
        margin-top: 16px;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .ok {
        color: #34d399;
      }
      .err {
        color: #f87171;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b0d10;
          color: #e6e8eb;
        }
        p {
          color: #8b929c;
        }
      }
    </style>
  </head>
  <body>
    <h1>CanvasUI Token Export</h1>
    <p>
      Exports local variables (all modes) as CanvasUI design tokens. Downloads tokens.json and tries
      to import into the local CanvasUI Lab dev server.
    </p>
    <button id="export">Export tokens</button>
    <div id="status"></div>
    <script>
      const status = document.getElementById("status");
      document.getElementById("export").onclick = () => {
        status.textContent = "Exporting…";
        status.className = "";
        parent.postMessage({ pluginMessage: { type: "export" } }, "*");
      };
      window.onmessage = async (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === "error") {
          status.textContent = "Export failed: " + msg.message;
          status.className = "err";
          return;
        }
        if (msg.type !== "tokens") return;
        const json = JSON.stringify(msg.payload, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = "tokens.json";
        anchor.click();
        URL.revokeObjectURL(url);
        try {
          const res = await fetch("http://localhost:5173/api/tokens/import", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ format: "canonical", payload: msg.payload }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || res.status);
          status.textContent =
            "Downloaded tokens.json\nImported " + data.imported + " tokens into CanvasUI Lab.";
          status.className = "ok";
        } catch (e) {
          status.textContent =
            "Downloaded tokens.json\nLocal import failed (is the dev server running?): " +
            e.message;
          status.className = "err";
        }
      };
    </script>
  </body>
</html>
